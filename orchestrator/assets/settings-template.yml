---
testbed_id: "${USER}-mysticeti"
cloud_provider: custom
token_file: "/Users/${USER}/.aws/credentials"
ssh_private_key_file: "/Users/${USER}/.ssh/aws"
regions:
  - us-west-1
specs: m5d.8xlarge
repository:
  url: https://github.com/asonnino/mysticeti.git
  commit: main

# Example settings file for custom mode
testbed_id: "${USER}-testbed"
cloud_provider: "custom"

# Default specs description
specs: "default"

# Custom machines configuration
cusom_machines:
  - host: "192.168.1.10"
    region: "datacenter-1"
    ssh_port: 22
    specs: "4-core-8gb"
  
  - host: "192.168.1.11"
    region: "datacenter-1"
    ssh_port: 22
    specs: "8-core-16gb"
  
  - host: "worker-01.example.com"
    region: "office-network"
    ssh_port: 2222
    specs: "16-core-32gb"
  
  - host: "worker-02.example.com"
    region: "office-network"
    # ssh_port defaults to 22
    # specs defaults to the global "specs" value