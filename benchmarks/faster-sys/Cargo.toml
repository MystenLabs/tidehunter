[package]
name = "faster-sys"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.0"
bindgen = "0.69"  # Use a newer version to avoid clang-sys conflicts
pkg-config = "0.3"
cmake = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies if needed

[features]
default = []
# Enable FASTER and F2 backends (Linux only)
enable-faster = []