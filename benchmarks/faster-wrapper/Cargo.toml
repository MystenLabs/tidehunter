[package]
name = "faster-wrapper"
version = "0.1.0"
edition = "2021"

[dependencies]
faster-sys = { path = "../faster-sys" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"

[features]
default = []
# Enable FASTER and F2 backends (Linux only)
enable-faster = ["faster-sys/enable-faster"]

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies if needed